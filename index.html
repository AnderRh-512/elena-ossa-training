<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Elena Ossa · VEKTOR Training Live</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<style>
:root{
  --bg:#0D1F1A;--panel:#13281F;--p2:#0A1A13;--line:#1F3B30;
  --green:#1D9E75;--gdim:#155A41;--gg:rgba(29,158,117,.13);
  --dark:#085041;--gold:#E0A458;--gol:rgba(224,164,88,.16);
  --text:#F4F4F0;--muted:#8FA89D;--m2:#3A5B4E;--danger:#D9694F;
  --r:14px;--rs:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;line-height:1.6;
  background-image:radial-gradient(ellipse at 0% 0%,rgba(29,158,117,.10) 0%,transparent 55%),radial-gradient(ellipse at 100% 0%,rgba(224,164,88,.05) 0%,transparent 40%);}
h1,h2,h3,h4{font-family:'Playfair Display',serif;}
button{font-family:'Outfit',sans-serif;cursor:pointer;border:none;}
textarea,input{font-family:'Outfit',sans-serif;}
.hide{display:none!important;}

/* BAR */
.bar{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid var(--line);background:rgba(13,31,26,.94);backdrop-filter:blur(10px);position:sticky;top:0;z-index:200;}
.brand{display:flex;align-items:center;gap:9px;}
.vk{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--green),var(--dark));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#031009;}
.bname{font-size:11px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;font-weight:500;}
.livepill{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:500;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,164,88,.6)}70%{box-shadow:0 0 0 8px rgba(224,164,88,0)}100%{box-shadow:0 0 0 0 rgba(224,164,88,0)}}

/* JOIN */
.join{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.jbox{max-width:500px;width:100%;}
.eyebrow{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.jbox h1{font-size:clamp(26px,4vw,34px);font-weight:700;line-height:1.2;margin-bottom:8px;}
.jsub{font-size:13.5px;color:var(--muted);line-height:1.65;margin-bottom:6px;}
.objbox{border-left:3px solid var(--green);border-radius:0 12px 12px 0;background:var(--gg);padding:13px 16px;margin:18px 0 24px;font-size:13.5px;line-height:1.65;color:var(--muted);}
.objbox b{color:var(--green);}
.rcard{display:block;width:100%;padding:18px 20px;margin-bottom:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);text-align:left;color:var(--text);transition:border-color .15s,background .15s;}
.rcard:hover{border-color:var(--green);background:var(--p2);}
.rct{font-size:15px;font-weight:600;margin-bottom:3px;}
.rcd{font-size:12px;color:var(--muted);font-weight:300;}
.ninp{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--p2);color:var(--text);font-size:15px;margin-bottom:10px;transition:border-color .15s;}
.ninp:focus{outline:none;border-color:var(--green);}
.bpri{width:100%;padding:14px;border-radius:12px;background:var(--green);color:#031009;font-weight:700;font-size:15px;transition:opacity .15s;}
.bpri:disabled{opacity:.3;cursor:not-allowed;}
.bpri:not(:disabled):hover{opacity:.85;}
.meettip{margin-top:18px;padding:14px 16px;border-radius:12px;background:rgba(29,158,117,.06);border:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.7;text-align:center;}
.meettip strong{color:var(--text);}
.namebtn{display:flex;flex-direction:column;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--p2);color:var(--text);font-size:14px;font-weight:600;transition:border-color .15s,background .15s;}
.namebtn:hover{border-color:var(--green);background:var(--panel);}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}

/* RAIL */
.railwrap{padding:14px 0 0;}
.rail{display:flex;gap:3px;margin-bottom:8px;}
.rseg{height:6px;border-radius:3px;background:var(--line);transition:background .3s;}
.rseg.done{background:var(--gdim);}
.rseg.active{background:var(--green);}
.railmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.railcur{font-size:14px;font-weight:600;}
.railinfo{font-size:11.5px;color:var(--muted);}
.railbtns{display:flex;gap:7px;}
.bgh{padding:8px 14px;border-radius:var(--rs);border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px;transition:border-color .15s,color .15s;}
.bgh:hover:not(:disabled){border-color:var(--green);color:var(--text);}
.bgh:disabled{opacity:.28;cursor:not-allowed;}

/* GRID */
.pgrid{display:grid;grid-template-columns:1fr 370px;gap:14px;padding:0 0 28px;align-items:start;}
@media(max-width:950px){.pgrid{grid-template-columns:1fr;}}
.wrap{max-width:1200px;margin:0 auto;padding:0 18px;}

/* CARD */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.chead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.chead h3{font-family:'Outfit',sans-serif;font-size:14.5px;font-weight:600;}
.tag{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.tagt{color:var(--muted);border:1px solid var(--line);}
.tagp{color:var(--green);border:1px solid var(--gdim);}
.tagg{color:var(--gold);border:1px solid rgba(224,164,88,.35);}
.taglive{color:var(--green);border:1px solid var(--gdim);}

/* SCRIPT */
.bh{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.bnum{width:42px;height:42px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--green),var(--dark));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#031009;}
.bht h2{font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;line-height:1.25;}
.bhts{font-size:11.5px;color:var(--muted);margin-top:2px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:500;}
.chipt{background:rgba(138,168,157,.1);color:var(--muted);border:1px solid var(--line);}
.chipp{background:rgba(29,158,117,.1);color:var(--green);border:1px solid var(--gdim);}
.hook{border-left:3px solid var(--gold);border-radius:0 12px 12px 0;background:var(--gol);padding:12px 15px;margin-bottom:13px;font-size:13.5px;line-height:1.65;}
.hlbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;display:block;margin-bottom:6px;}
.slbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:9px;}
.spt{padding:11px 14px;border-radius:var(--rs);margin-bottom:7px;background:var(--p2);border:1px solid var(--line);font-size:13px;line-height:1.65;}
.spt b{color:var(--green);}
.spt em{color:var(--gold);font-style:normal;}
.tip{border-left:3px solid var(--green);border-radius:0 var(--rs) var(--rs) 0;background:var(--gg);padding:11px 14px;margin-top:13px;font-size:12.5px;line-height:1.6;color:var(--muted);}
.tlbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--green);font-weight:600;display:block;margin-bottom:5px;}

/* CONTROLS */
.actr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--p2);margin-bottom:9px;}
.art{font-size:13px;font-weight:600;}
.ars{font-size:11px;color:var(--muted);margin-top:1px;}
.blaunch{padding:7px 13px;border-radius:var(--rs);font-size:12px;font-weight:600;border:1px solid var(--green);background:transparent;color:var(--green);white-space:nowrap;transition:background .15s,color .15s;flex-shrink:0;}
.blaunch:hover,.blaunch.on{background:var(--green);color:#031009;}
.bstop{padding:7px 13px;border-radius:var(--rs);font-size:12px;font-weight:600;border:1px solid rgba(217,105,79,.4);background:transparent;color:var(--danger);white-space:nowrap;flex-shrink:0;}
.bpen{padding:7px 13px;border-radius:var(--rs);font-size:12px;font-weight:600;border:1px solid rgba(217,105,79,.5);background:transparent;color:var(--danger);white-space:nowrap;transition:background .15s;}
.bpen:hover{background:rgba(217,105,79,.15);border-color:var(--danger);}
.resp{padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--p2);margin-bottom:9px;}
.rwho{font-size:11.5px;color:var(--green);font-weight:600;margin-bottom:4px;}
.rtxt{font-size:12.5px;line-height:1.5;margin-bottom:6px;}
.schip{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:20px;font-size:11.5px;background:var(--gdim);color:var(--text);}

/* LEADERBOARD */
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);margin-bottom:5px;background:var(--p2);}
.lbrk{width:20px;text-align:center;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;font-size:14px;}
.lbnm{flex:1;font-size:13px;}
.lbpt{font-weight:600;color:var(--green);font-size:13px;}
.lbempty{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 0;}

/* HANGMAN */
.hang-word{text-align:center;font-family:'Playfair Display',serif;font-size:clamp(28px,7vw,44px);letter-spacing:14px;color:var(--gold);margin:18px 0 12px;text-shadow:0 2px 12px rgba(224,164,88,.15);word-spacing:8px;}
.hang-meta{text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px;}
.hang-meta b{color:var(--gold);}
.hang-err{text-align:center;font-size:12px;color:var(--danger);margin:6px 0 14px;letter-spacing:1px;}
.hang-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0;}
@media(min-width:640px){.hang-grid{grid-template-columns:repeat(13,1fr);}}
.hkey{aspect-ratio:1;border-radius:8px;background:var(--p2);border:1px solid var(--line);color:var(--text);font-family:'Outfit',sans-serif;font-weight:600;font-size:13px;transition:background .12s,border-color .12s;}
.hkey:hover:not(:disabled){background:var(--panel);border-color:var(--green);}
.hkey.hit{background:rgba(29,158,117,.18);border-color:var(--green);color:var(--green);}
.hkey.miss{background:rgba(217,105,79,.14);border-color:rgba(217,105,79,.4);color:var(--danger);opacity:.6;}
.hkey:disabled{cursor:default;}
.hang-progress{margin:8px 0 4px;}
.hang-lesson{border-left:3px solid var(--green);background:var(--gg);padding:12px 14px;border-radius:0 12px 12px 0;margin-top:14px;font-size:13px;color:var(--text);line-height:1.6;}
.hang-agents{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.hang-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--p2);border:1px solid var(--line);border-radius:10px;transition:border-color .2s;}
.hang-row.won{border-color:var(--gdim);background:rgba(29,158,117,.08);}
.hang-row.lost{border-color:rgba(217,105,79,.35);background:rgba(217,105,79,.06);}
.hang-row-name{font-size:12.5px;font-weight:600;color:var(--text);}
.hang-row-word{font-family:'Playfair Display',serif;font-size:18px;letter-spacing:5px;color:var(--gold);overflow-x:auto;white-space:nowrap;padding:0 4px;}
.hang-row-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:80px;}
.hang-row-status{font-size:11px;color:var(--muted);}

/* PARTICIPANT */
.pview{max-width:480px;margin:0 auto;padding:16px 16px 36px;}
.pbadge{display:inline-block;padding:4px 12px;border-radius:20px;background:rgba(29,158,117,.1);border:1px solid var(--gdim);font-size:11px;color:var(--green);font-weight:500;margin-bottom:14px;}
.wait{text-align:center;padding:60px 16px;}
.wait .wi{font-size:38px;margin-bottom:14px;}
.wait h3{font-family:'Outfit',sans-serif;font-size:17px;font-weight:600;margin-bottom:8px;}
.wait p{font-size:13px;color:var(--muted);line-height:1.6;}
.rpsc{border-left:3px solid var(--gold);border-radius:0 13px 13px 0;background:var(--gol);padding:13px 15px;margin-bottom:13px;font-size:14px;line-height:1.65;}
.rpsc b{color:var(--gold);}
textarea.rpin{width:100%;min-height:120px;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--p2);color:var(--text);font-size:14.5px;resize:vertical;outline:none;transition:border-color .15s;}
textarea.rpin:focus{border-color:var(--green);}
.cc{font-size:11.5px;color:var(--muted);text-align:right;margin:3px 0 9px;}
.bsend{padding:13px 22px;border-radius:12px;background:var(--green);color:#031009;font-weight:700;font-size:15px;transition:opacity .15s;width:100%;}
.bsend:disabled{opacity:.3;cursor:not-allowed;}
.bsend:not(:disabled):hover{opacity:.85;}
.emresp{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}

/* QUIZ */
.qwrap{max-width:680px;margin:0 auto;}
.qhead{margin-bottom:18px;}
.qq{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;}
.qqtxt{font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:12px;}
.qopt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-bottom:6px;border-radius:12px;border:1px solid var(--line);background:var(--p2);color:var(--text);font-size:13.5px;line-height:1.5;transition:border-color .15s,background .15s;}
.qopt:hover{border-color:var(--green);background:var(--panel);}
.qopt.sel{border-color:var(--green);background:rgba(29,158,117,.12);}
.qopt.cor{border-color:var(--green);background:rgba(29,158,117,.18);}
.qopt.wrg{border-color:var(--danger);background:rgba(217,105,79,.12);}
.qm{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;margin-top:1px;transition:background .15s,border-color .15s;}
.qopt.sel .qm,.qopt.cor .qm{background:var(--green);border-color:var(--green);}
.qopt.wrg .qm{background:var(--danger);border-color:var(--danger);}
.qsummary{text-align:center;padding:26px 20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;}
.qsummary .qscore{font-family:'Playfair Display',serif;font-size:52px;font-weight:700;color:var(--gold);line-height:1;margin:6px 0;}
.qsummary .qpct{font-size:14px;color:var(--muted);margin-bottom:12px;}
.qsummary .qmsg{font-size:13.5px;color:var(--text);line-height:1.55;}

.breset{padding:8px 14px;border-radius:var(--rs);border:1px solid rgba(217,105,79,.3);background:transparent;color:rgba(217,105,79,.65);font-size:12px;}
.breset:hover{border-color:var(--danger);color:var(--danger);}
.foot{text-align:center;padding:22px 10px;font-size:11px;color:var(--m2);}
</style>
</head>

let role='', name='';
let gCtrl = {bid:'b1', phase:'idle', aid:null};
let gData = emptyData();
let db = null;
let listenerOn = false;
const $R = document.getElementById('R');

function emptyData(){ return {lb:{}, hang:{idx:0, perAgent:{}}, rp:{}, quiz:{}, closing:{}}; }
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bById = id => S.blocks.find(b => b.id===id) || S.blocks[0];
const bIdx = id => S.blocks.findIndex(b => b.id===id);
const totalMin = S.blocks.reduce((a,b) => a + (b.min||0), 0);

/* ================================================================
   FIREBASE INIT + LISTENER
   ================================================================ */
function initFirebase(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    return true;
  }catch(e){ console.error('Firebase init', e); return false; }
}

function startListener(){
  if(listenerOn || !db) return;
  listenerOn = true;
  let prevSig = '';
  db.ref(ROOT).on('value', snap => {
    const val = snap.val() || {};
    const newCtrl = val.ctrl || {bid:'b1', phase:'idle', aid:null};
    const newData = val.data || emptyData();
    // Ensure nested structure exists
    newData.lb = newData.lb || {};
    newData.hang = newData.hang || {idx:0, guessed:[], wrong:0, lastBy:null};
    newData.rp = newData.rp || {};
    newData.quiz = newData.quiz || {};
    newData.closing = newData.closing || {};
    const sig = JSON.stringify(newCtrl) + '|' + JSON.stringify(newData);
    if(sig === prevSig) return;
    prevSig = sig;
    gCtrl = newCtrl;
    gData = newData;
    if(role === 'pres') renderPres();
    else if(role === 'part') renderPart();
  }, e => console.error('FB listener', e));
}

async function setCtrl(c){ gCtrl = c; if(db) await db.ref(`${ROOT}/ctrl`).set(c); }
async function setData(d){ gData = d; if(db) await db.ref(`${ROOT}/data`).set(d); }
async function getDataFresh(){
  if(!db) return gData;
  try{ const snap = await db.ref(`${ROOT}/data`).once('value'); return snap.val() || emptyData(); }
  catch(e){ return gData; }
}

function renderPresHangman(){
  const h = gData.hang || {idx:0, perAgent:{}};
  const idx = h.idx || 0;
  const cur = HANGMAN_BANK[idx];
  const perAgent = h.perAgent || {};

  const rows = PLAYERS.map(p => {
    const st = perAgent[p] || {guessed:[], wrong:0, status:'playing'};
    const guessedSet = new Set(st.guessed || []);
    const displayWord = cur.word.split('').map(l => guessedSet.has(l) ? l : '_').join(' ');
    let badge = '';
    let rowCls = 'hang-row';
    if(st.status === 'won'){ badge = '<span class="schip">✓ +10</span>'; rowCls += ' won'; }
    else if(st.status === 'lost'){ badge = '<span class="schip" style="background:rgba(217,105,79,.3);color:var(--danger);">✗ −5</span>'; rowCls += ' lost'; }
    else badge = '<span class="hang-row-status">jugando…</span>';
    return `<div class="${rowCls}">
      <div class="hang-row-name">${esc(p)}</div>
      <div class="hang-row-word">${displayWord}</div>
      <div class="hang-row-meta"><span class="hang-row-status">Err ${st.wrong||0}/6</span>${badge}</div>
    </div>`;
  }).join('');

  const allDone = PLAYERS.every(p => {
    const st = perAgent[p];
    return st && (st.status === 'won' || st.status === 'lost');
  });

  return `<div class="card">
    <div class="chead"><h3>🎯 Ahorcado · Palabra ${idx+1}/${HANGMAN_BANK.length}</h3><span class="tag taglive">Vivo · Individual</span></div>
    <div class="hang-meta">Palabra actual: <b>${esc(cur.display)}</b> — reemplaza <b>${esc(cur.replaces)}</b></div>
    <div class="hang-agents">${rows}</div>
    ${allDone ? '<div class="hang-lesson" style="margin-top:14px;">✅ <b>Todas terminaron.</b> Puntos ya asignados. Clic en Siguiente palabra para continuar.</div>' : ''}
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
      <button class="blaunch" id="hng-next">Siguiente palabra →</button>
      <button class="bgh" id="hng-reset">Reintentar palabra actual (sin cambio de puntos)</button>
    </div>
  </div>`;
}

function renderPresRoleplay(block){
  const rp = block.rp;
  const isOn = gCtrl.phase === 'rp' && gCtrl.aid === rp.id;
  const responses = ((gData.rp||{})[rp.id]||{}).responses || {};
  const entries = Object.entries(responses);
  const respHTML = entries.length === 0
    ? '<div class="emresp">Esperando respuestas del equipo...</div>'
    : entries.map(([n,r]) => `<div class="resp">
        <div class="rwho">${esc(n)}</div>
        <div class="rtxt">${esc(r.text||'')}</div>
        <span class="schip">⭐ +15 pts sumados</span>
      </div>`).join('');

  return `<div class="card">
    <div class="chead"><h3>🎭 ${esc(rp.label)}</h3><span class="tag tagp">Roleplay</span></div>
    <div class="actr">
      <div><div class="art">Activar roleplay</div><div class="ars">Cada agente responde desde su celular</div></div>
      ${isOn
        ? '<button class="bstop" id="rp-stop">Cerrar</button>'
        : '<button class="blaunch" id="rp-launch">Lanzar</button>'}
    </div>
    ${isOn ? respHTML : ''}
    ${isOn && entries.length > 0 ? '<button class="bgh" id="rp-clear" style="margin-top:8px;font-size:12px;">Limpiar respuestas del caso</button>' : ''}
  </div>`;
}

function renderPresQuiz(){
  const q = gData.quiz || {};
  const isOn = gCtrl.phase === 'quiz';
  const entries = Object.entries(q).filter(([_,v]) => v && v.submitted);
  return `<div class="card">
    <div class="chead"><h3>📊 Evaluación 10 preguntas</h3><span class="tag tagg">Quiz</span></div>
    <div class="actr">
      <div><div class="art">Activar evaluación</div><div class="ars">Cada agente responde en su celular</div></div>
      ${isOn
        ? '<button class="bstop" id="qz-stop">Cerrar</button>'
        : '<button class="blaunch" id="qz-launch">Lanzar</button>'}
    </div>
    ${entries.length === 0 ? '<div class="emresp">Esperando respuestas...</div>'
      : entries.sort((a,b) => b[1].score - a[1].score).map(([n,v]) => {
          const pct = Math.round((v.score/QUIZ.length)*100);
          return `<div class="resp"><div class="rwho">${esc(n)}</div><div class="rtxt">${v.score}/${QUIZ.length} · ${pct}%</div><span class="schip">+${v.score*2} pts</span></div>`;
        }).join('')}
  </div>`;
}

function bindPresEvents(){
  const rp = document.getElementById('rp'), rn = document.getElementById('rn');
  if(rp) rp.onclick = () => moveBlock(-1);
  if(rn) rn.onclick = () => moveBlock(1);
  const bres = document.getElementById('bres');
  if(bres) bres.onclick = async () => {
    if(confirm('¿Borrar todos los puntos, respuestas y evaluaciones?')){
      await setData(emptyData());
      await setCtrl({bid:'b1', phase:'idle', aid:null});
    }
  };
  // Hangman — presenter only navigates, doesn't play
  const hNext = document.getElementById('hng-next');
  if(hNext) hNext.onclick = async () => {
    const d = await getDataFresh();
    d.hang = d.hang || {};
    d.hang.idx = ((d.hang.idx||0) + 1) % HANGMAN_BANK.length;
    d.hang.perAgent = {};
    await setData(d);
  };
  const hReset = document.getElementById('hng-reset');
  if(hReset) hReset.onclick = async () => {
    if(!confirm('¿Reiniciar palabra actual? Los puntos ya otorgados no se reversan.')) return;
    const d = await getDataFresh();
    d.hang = d.hang || {};
    d.hang.perAgent = {};
    await setData(d);
  };
  // Roleplay
  const rpLaunch = document.getElementById('rp-launch');
  if(rpLaunch) rpLaunch.onclick = async () => await setCtrl({...gCtrl, phase:'rp', aid:bById(gCtrl.bid).rp.id});
  const rpStop = document.getElementById('rp-stop');
  if(rpStop) rpStop.onclick = async () => await setCtrl({...gCtrl, phase:'idle', aid:null});
  const rpClear = document.getElementById('rp-clear');
  if(rpClear) rpClear.onclick = async () => {
    if(!confirm('¿Limpiar todas las respuestas de este caso?')) return;
    const d = await getDataFresh();
    const rid = bById(gCtrl.bid).rp.id;
    if(d.rp && d.rp[rid]) d.rp[rid].responses = {};
    await setData(d);
  };
  // Quiz
  const qzLaunch = document.getElementById('qz-launch');
  if(qzLaunch) qzLaunch.onclick = async () => await setCtrl({...gCtrl, phase:'quiz', aid:null});
  const qzStop = document.getElementById('qz-stop');
  if(qzStop) qzStop.onclick = async () => await setCtrl({...gCtrl, phase:'idle', aid:null});
}

function lbHTML(lb){
  const e = Object.entries(lb||{}).sort((a,b) => b[1]-a[1]);
  if(!e.length) return '<div class="lbempty">Los puntos aparecen acá en tiempo real.</div>';
  return e.map(([n,p],i) => `<div class="lbrow"><div class="lbrk">${i+1}</div><div class="lbnm">${esc(n)}</div><div class="lbpt">${p} pts</div></div>`).join('');
}

async function moveBlock(delta){
  const idx = bIdx(gCtrl.bid);
  const ni = Math.min(S.blocks.length-1, Math.max(0, idx+delta));
  await setCtrl({bid:S.blocks[ni].id, phase:'idle', aid:null});
}

/* ================================================================
   PARTICIPANT
   ================================================================ */
function renderPart(){
  const block = bById(gCtrl.bid);
  const idx = bIdx(gCtrl.bid);
  const isCierre = block.id === 'cierre';
  const railSegs = S.blocks.map((_,i) => {
    let c = 'rseg'; if(i<idx) c+=' done'; else if(i===idx) c+=' active';
    return `<div class="${c}" style="flex:${S.blocks[i].min||8}"></div>`;
  }).join('');

  let content = '';
  if(isCierre){
    content = renderPartClosing();
  } else if(block.hangman){
    content = renderPartHangman();
  } else if(block.rp && gCtrl.phase === 'rp' && gCtrl.aid === block.rp.id){
    content = renderPartRoleplay(block);
  } else if(block.quiz && gCtrl.phase === 'quiz'){
    content = renderPartQuiz();
  } else {
    content = `<div class="wait"><div class="wi">📲</div><h3>${esc(block.title)}</h3><p>Seguí la explicación en la pantalla del presentador.<br>Cuando lance una actividad, aparece acá.</p></div>`;
  }

  $R.innerHTML = `
  <div class="bar">
    <div class="brand"><div class="vk">V</div><div class="bname">${esc(name)}</div></div>
    <div class="livepill"><div class="dot"></div>En Vivo</div>
  </div>
  <div class="pview">
    <div class="pbadge">Bloque ${idx+1} de ${S.blocks.length}</div>
    <div class="rail" style="margin-bottom:14px;">${railSegs}</div>
    ${content}
  </div>
  <div class="foot">VEKTOR · Elena Ossa · Módulos 4 y 5</div>`;

  bindPartEvents(block);
}

function renderPartHangman(){
  const h = gData.hang || {idx:0, perAgent:{}};
  const idx = h.idx || 0;
  const cur = HANGMAN_BANK[idx];
  const st = (h.perAgent||{})[name] || {guessed:[], wrong:0, status:'playing'};
  const guessedSet = new Set(st.guessed||[]);
  const displayWord = cur.word.split('').map(l => guessedSet.has(l) ? l : '_').join(' ');
  const solved = st.status === 'won';
  const lost = st.status === 'lost';
  const done = solved || lost;
  const grid = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(letter => {
    const hit = guessedSet.has(letter) && cur.word.includes(letter);
    const miss = guessedSet.has(letter) && !cur.word.includes(letter);
    const cls = 'hkey' + (hit?' hit':'') + (miss?' miss':'');
    return `<button class="${cls}" data-hk="${letter}" ${guessedSet.has(letter) || done ? 'disabled':''}>${letter}</button>`;
  }).join('');
  return `<div class="card">
    <div class="chead"><h3>🎯 Ahorcado orgánico</h3><span class="tag taglive">Palabra ${idx+1}/${HANGMAN_BANK.length}</span></div>
    <div class="hang-meta">Reemplaza: <b>${esc(cur.replaces)}</b> · <b style="color:var(--green);">Este intento es tuyo</b></div>
    <div class="hang-word">${displayWord}</div>
    <div class="hang-err">Tus errores: ${st.wrong||0} / 6</div>
    <div class="hang-grid">${grid}</div>
    ${solved ? `<div class="hang-lesson"><b>¡Resuelto! +10 pts sumados.</b> ${esc(cur.lesson)}</div>` : ''}
    ${lost ? `<div class="hang-lesson" style="border-left-color:var(--danger);background:rgba(217,105,79,.08);"><b>Palabra perdida (−5 pts).</b> Era <b>${esc(cur.display)}</b>. Esperá a que el presentador avance a la siguiente palabra.</div>` : ''}
  </div>`;
}

function renderPartRoleplay(block){
  const rp = block.rp;
  const responses = ((gData.rp||{})[rp.id]||{}).responses || {};
  const mine = responses[name];
  if(mine && mine.text){
    return `<div class="card">
      <div class="rpsc">${rp.ctx}</div>
      <div style="margin-top:10px;padding:14px;background:var(--p2);border:1px solid var(--gdim);border-radius:12px;">
        <div style="font-size:11px;color:var(--green);letter-spacing:1.5px;margin-bottom:6px;">TU RESPUESTA · +15 pts</div>
        <div style="font-size:13.5px;line-height:1.6;">${esc(mine.text)}</div>
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin-top:10px;">Esperando que el presentador comente las respuestas del grupo.</p>
    </div>`;
  }
  return `<div class="card">
    <div class="chead"><h3>${esc(rp.label)}</h3><span class="tag tagg">Roleplay</span></div>
    <div class="rpsc">${rp.ctx}</div>
    <textarea class="rpin" id="rpta" placeholder="Escribí tu respuesta como lo harías en la conversación real..." maxlength="600"></textarea>
    <div class="cc" id="cc">0 / 600</div>
    <button class="bsend" id="bts" disabled>Enviar respuesta</button>
  </div>`;
}

function renderPartQuiz(){
  const my = (gData.quiz||{})[name];
  if(my && my.submitted){
    const pct = Math.round((my.score/QUIZ.length)*100);
    let msg = '';
    if(pct >= 80) msg = '¡Excelente! Dominaste los pilares. ✨';
    else if(pct >= 60) msg = 'Bien encaminada. Repasa los casos que fallaste.';
    else msg = 'Toca revisar los pilares. La próxima sesión ponemos foco acá.';
    return `<div class="qsummary">
      <div style="font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;">Tu resultado</div>
      <div class="qscore">${my.score}/${QUIZ.length}</div>
      <div class="qpct">${pct}% · +${my.score*2} pts al leaderboard</div>
      <div class="qmsg">${msg}</div>
    </div>`;
  }
  return `<div class="qwrap">
    <div class="qhead"><div class="eyebrow">10 preguntas · Control de comando</div><h3 style="font-family:'Outfit',sans-serif;font-size:17px;font-weight:600;">Evaluación final</h3></div>
    ${QUIZ.map((item,idx) => `
      <div class="qq">
        <div class="qqtxt">${idx+1}. ${esc(item.q)}</div>
        ${item.opts.map((o,i) => `<button class="qopt" data-qi="${idx}" data-oi="${i}"><div class="qm"></div><span>${esc(o)}</span></button>`).join('')}
      </div>`).join('')}
    <button class="bsend" id="quiz-send" style="margin-top:14px;" disabled>Enviar evaluación</button>
  </div>`;
}

function renderPartClosing(){
  return `<div class="card">
    <h3 style="font-family:'Outfit',sans-serif;font-size:17px;margin-bottom:8px;">¡Gracias por la sesión! 🎉</h3>
    <p style="font-size:13.5px;color:var(--muted);line-height:1.6;">Compartí con el equipo tu compromiso para esta semana en la conversación de Meet.</p>
    <div style="margin-top:14px;"><div class="chead"><h3>🏆 Leaderboard Final</h3></div>${lbHTML(gData.lb)}</div>
  </div>`;
}

function bindPartEvents(block){
  // Hangman letter clicks — each agent has their own state, points auto-awarded
  document.querySelectorAll('[data-hk]').forEach(b => {
    b.onclick = async () => {
      const letter = b.dataset.hk;
      const d = await getDataFresh();
      const h = d.hang || {idx:0, perAgent:{}};
      h.perAgent = h.perAgent || {};
      const st = h.perAgent[name] || {guessed:[], wrong:0, status:'playing', awarded:false};
      if(st.status !== 'playing') return;
      if((st.guessed||[]).includes(letter)) return;
      const cur = HANGMAN_BANK[h.idx||0];
      st.guessed = [...new Set([...(st.guessed||[]), letter])].sort();
      if(!cur.word.includes(letter)) st.wrong = (st.wrong||0) + 1;
      // Check terminal states and auto-award/penalize
      const gs = new Set(st.guessed);
      const remaining = cur.word.split('').some(l => !gs.has(l));
      if(!remaining){
        st.status = 'won';
        if(!st.awarded){
          d.lb = d.lb || {};
          d.lb[name] = (d.lb[name]||0) + 10;
          st.awarded = true;
        }
      } else if((st.wrong||0) >= 6){
        st.status = 'lost';
        if(!st.awarded){
          d.lb = d.lb || {};
          d.lb[name] = Math.max(0, (d.lb[name]||0) - 5);
          st.awarded = true;
        }
      }
      h.perAgent[name] = st;
      d.hang = h;
      await setData(d);
    };
  });

  // Roleplay
  const rpta = document.getElementById('rpta'), bts = document.getElementById('bts'), cc = document.getElementById('cc');
  if(rpta && bts){
    rpta.addEventListener('input', () => {
      const l = rpta.value.length;
      if(cc) cc.textContent = `${l} / 600`;
      bts.disabled = l < 10;
    });
    bts.onclick = async () => {
      const txt = rpta.value.trim();
      if(!txt) return;
      bts.disabled = true; bts.textContent = 'Enviando...';
      const d = await getDataFresh();
      const rid = block.rp.id;
      d.rp[rid] = d.rp[rid] || {responses:{}};
      d.rp[rid].responses = d.rp[rid].responses || {};
      d.rp[rid].responses[name] = {text:txt};
      d.lb[name] = (d.lb[name]||0) + 15;
      await setData(d);
    };
  }

  // Quiz answer clicks
  const answers = {};
  document.querySelectorAll('.qopt').forEach(b => {
    b.onclick = () => {
      const qi = b.dataset.qi;
      answers[qi] = parseInt(b.dataset.oi, 10);
      document.querySelectorAll(`.qopt[data-qi="${qi}"]`).forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      const done = QUIZ.every((_,i) => answers[i] !== undefined);
      const send = document.getElementById('quiz-send');
      if(send) send.disabled = !done;
    };
  });
  const qsend = document.getElementById('quiz-send');
  if(qsend){
    qsend.onclick = async () => {
      qsend.disabled = true; qsend.textContent = 'Guardando...';
      let score = 0;
      QUIZ.forEach((item,i) => { if(answers[i] === item.cor) score++; });
      const d = await getDataFresh();
      d.quiz[name] = {answers: Object.values(answers), score, submitted:true};
      d.lb[name] = (d.lb[name]||0) + score * 2;
      await setData(d);
    };
  }
}

/* ================================================================
   BOOT
   ================================================================ */
if(initFirebase()){
  startListener();
  renderJoin();
} else {
  document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#F4F4F0;font-family:Outfit,sans-serif;">Error inicializando Firebase. Revisa la consola del navegador.</div>';
}
</script>
</body>
</html>
